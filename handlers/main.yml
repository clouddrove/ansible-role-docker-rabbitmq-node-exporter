---
# handlers for ansible-role-docker-rabbitmq_exporter

- name: Restart rabbitmq_exporter
  ansible.builtin.service:
    name: Rabbitmq_exporter
    state: restarted
    enabled: true

- name: Start rabbitmq_exporter
  ansible.builtin.service:
    name: Rabbitmq_exporter
    state: started
    enabled: true

- name: Reload rabbitmq_exporter
  ansible.builtin.service:
    name: Rabbitmq_exporter
    state: reloaded
    enabled: true
